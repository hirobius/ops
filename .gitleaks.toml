title = "HDS Gitleaks Config"

[extend]
# Use Gitleaks default rules as the baseline
useDefault = true

[[rules]]
id = "hds-design-tokens"
description = "Allowlist HDS design-token paths falsely matched as API keys"
regex = '''primitive\.(radius|size)\.[\w\.]+'''
path = '''(?i)(src/app/data/.*\.json|public/.*\.json)$'''
tags = ["allowlist", "design-tokens"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''primitive\.(radius|size)\.[\w\.]+''',
]

# Extends the default slack-webhook-url rule (same id, no regex, so the default
# detection is kept) with one false-positive exemption. The check-secrets
# gate's violating fixture holds a placeholder webhook: zeroed workspace/bot IDs
# and an all-X token. It was the only finding in the 2026-09-16 full-history
# scan (ops#32). Path AND regex both have to match, so a real webhook pasted into
# that file is still caught. The fixture-proof run is unaffected because it
# scans a temp copy outside this path.
# gitleaks 8.30.1 (the version CI pins) applies this. Older releases load the
# config but ignore the exemption, so they still report the fixture.
[[rules]]
id = "slack-webhook-url"
[[rules.allowlists]]
description = "check-secrets violating fixture: placeholder Slack webhook (zeroed IDs, X token)"
condition = "AND"
paths = ['''^fixtures/check-secrets/violating\.example\.txt$''']
regexTarget = "secret"
regexes = ['''hooks\.slack\.com/services/T0+/B0+/X+$''']

[allowlist]
description = "Global allowlist for known false positives in HDS"
paths = [
  '''(?i)(^.*\/\.pnpm\/.*$)''',
  '''(?i)(^.*\/node_modules\/.*$)''',
  '''(?i)(^.*\/dist\/.*$)''',
  '''(?i)(^.*\.claude\/worktrees\/.*$)''',
]
regexes = [
  # HDS design-system token paths (not secrets)
  '''primitive\.(radius|size|color|space|border|shadow)\.[\w\.\-]+''',
]
