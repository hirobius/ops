name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck, canon validators, and layout tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Advisory only (#243). Every advisory here is in dev/build tooling
        # (vitest, @babel/* -> browserslist), not shipped runtime code, and this
        # step was failing every PR regardless of the diff — training reviewers to
        # ignore red. Kept visible in the logs (--audit-level high focuses on the
        # serious ones) but non-blocking on the PR gate. Real high/critical coverage
        # lives in the separate scheduled security-audit lane; ralph-gate
        # (typecheck + full suite + lint) is the actual merge condition.
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Build (catches Vite/asset issues)
        run: pnpm build

      - name: Install Playwright (chromium only)
        # Setup, not a gate: the browser binary the ci-pr layout-tests gate needs.
        run: pnpm exec playwright install --with-deps chromium

      - name: CI-PR registry gates (ci-pr channel)
        # The ONLY way this workflow runs a gate (#241). Single source of truth:
        # docs/guardrails/registry.json, firingChannel ci-pr — typecheck, type
        # coverage, and the layout tests are registry gates there, not steps here.
        # To add/remove a CI check, change the registry, never this file;
        # scripts/__tests__/quality-workflow.test.mjs fails on a new direct step.
        # run-gates runs every gate (no fail-fast) and exits 1 if any
        # ERROR-severity gate failed. A warn/info gate's non-zero exit is
        # printed and does not fail the job (ops#306) — severity lives in the
        # registry, so demoting a check to advisory is a registry edit.
        run: node scripts/run-gates.mjs --channel ci-pr --parallel 4
