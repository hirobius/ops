name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck, canon validators, and layout tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Advisory only (#243). Every advisory here is in dev/build tooling
        # (vitest, @babel/* -> browserslist), not shipped runtime code, and this
        # step was failing every PR regardless of the diff — training reviewers to
        # ignore red. Kept visible in the logs (--audit-level high focuses on the
        # serious ones) but non-blocking on the PR gate. Real high/critical coverage
        # lives in the separate scheduled security-audit lane; ralph-gate
        # (typecheck + full suite + lint) is the actual merge condition.
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Build (catches Vite/asset issues)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Type coverage (≥99.9%)
        # Replaced bespoke check-type-coverage-ratchet.mjs (99 LOC) with native type-coverage CLI.
        # Coverage must stay ≥99.9% (101149/101250 baseline, 2026-05-06).
        run: pnpm exec type-coverage --at-least 99.9

      - name: CI-PR registry gates (ci-pr channel)
        # Single source of truth: reads docs/guardrails/registry.json --channel ci-pr.
        # To add/remove a gate from ci-pr, update registry.json firingChannel — do not
        # add explicit invocations here. Runs with --parallel 4 for speed.
        run: node scripts/run-gates.mjs --channel ci-pr --parallel 4

      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Layout tests
        run: pnpm test:layout
