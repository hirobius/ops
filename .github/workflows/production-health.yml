name: Production health

# Scheduled caller for scripts/check-production-health.mjs (ops#318; the script
# itself landed in ops#347). Every 6 hours it asserts /ops's LIVE data path —
# real rows from GET /api/tasks, not merely a 200 — because on 2026-09-14 a
# paused Supabase project left the Tasks board silently empty and nothing
# noticed.
#
# Loud on failure, two ways:
#   - the script pages Discord through lib/ops/notify.mjs with the cause and
#     the fix (including the Supabase resume link), then exits 1 so the run
#     goes red;
#   - if the check cannot run at all (a missing secret, a setup failure), the
#     last step pages Discord itself — a broken watchdog must never be silent.
#
# Repository secrets (https://github.com/hirobius/ops/settings/secrets/actions):
#   OPS_AGENT_KEY          required — the SAME value as OPS_AGENT_KEY in Vercel
#   DISCORD_WEBHOOK_URL    required — where a failed check pages
#   SUPABASE_ACCESS_TOKEN  optional — adds the INACTIVE / COMING_UP / RESTORING
#                          project-status detail; skipped (with a warning) if unset
# Repository variable (optional): OPS_BASE_URL overrides the production origin.
#
# No `pnpm install`: the script and the notify seam import only node built-ins,
# so a package-registry outage cannot masquerade as a production outage.

on:
  schedule:
    # Every 6 hours, at :41 — off the top of the hour, when Actions queues are busiest.
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    name: /ops live data path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_BASE_URL: ${{ vars.OPS_BASE_URL || 'https://hirobius-ops.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require secrets
        id: secrets
        env:
          OPS_AGENT_KEY: ${{ secrets.OPS_AGENT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SECRETS_URL="https://github.com/hirobius/ops/settings/secrets/actions"
          missing=""
          if [ -z "$OPS_AGENT_KEY" ]; then
            echo "::error title=Missing secret OPS_AGENT_KEY::OPS_AGENT_KEY is not set as a repository secret, so the health check cannot authenticate to /api/tasks. Add it with the same value as OPS_AGENT_KEY in Vercel (Production): $SECRETS_URL"
            missing="$missing OPS_AGENT_KEY"
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error title=Missing secret DISCORD_WEBHOOK_URL::DISCORD_WEBHOOK_URL is not set as a repository secret, so a failed health check would page nobody. Add it: $SECRETS_URL"
            missing="$missing DISCORD_WEBHOOK_URL"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Optional secret SUPABASE_ACCESS_TOKEN::SUPABASE_ACCESS_TOKEN is not set, so the INACTIVE / COMING_UP / RESTORING project-status check is skipped (the data-path check still runs). Create a token at https://supabase.com/dashboard/account/tokens and add it: $SECRETS_URL"
          fi
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing — add them at $SECRETS_URL" >&2
            exit 1
          fi

      - name: Check production health
        id: health
        env:
          OPS_AGENT_KEY: ${{ secrets.OPS_AGENT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-production-health.mjs

      # The script pages Discord itself when a check fails. This covers the
      # other case: the check never ran, so /ops is unwatched until someone looks.
      - name: Page Discord when the check could not run
        if: failure() && steps.health.outcome != 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MISSING: ${{ steps.secrets.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$MISSING" ]; then
            DETAIL="Missing repository secret(s): $MISSING. Add them at https://github.com/hirobius/ops/settings/secrets/actions (OPS_AGENT_KEY = the same value as in Vercel Production)."
          else
            DETAIL="A setup step failed before the health check ran. See the run log: $RUN_URL"
          fi
          node scripts/notify.mjs --kind blocked \
            --title "Production health cron could not run: /ops is unwatched" \
            --detail "$DETAIL" --url "$RUN_URL" --task "ops#318"
