name: Ralph Gate

# Thin caller — the engine lives in the PUBLIC hirobius/ralph repo (public
# because GitHub forbids public repos from calling private reusables; every
# hirobius repo, private or public, calls the same engine).
#
# ralph/* PRs: deterministic gate + independent AI review + HUMAN-approved
# merge (label the PR `ralph-approved`, or pre-tag the issue `ralph-auto` for
# batch approval) + one bounded self-heal on failure. Human PRs pass through.
# The `labeled` trigger is the approval fast-path: adding `ralph-approved`
# arms auto-merge without re-running the review.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  ralph-gate:
    # TEMP outage pin (ops#144): hirobius/ralph@main regressed at 7387f7c8 —
    # every @main gate call startup-fails. Pinned to the last known-good
    # engine sha; restore @main once the engine is fixed.
    uses: hirobius/ralph/.github/workflows/ralph-gate-reusable.yml@03dea1df3554eb34ec5e7b7231488c6bfe9ac7bb
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
      actions: write # chain hop: gate dispatches the next run after an auto-merge
    secrets: inherit
