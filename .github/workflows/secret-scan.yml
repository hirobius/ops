name: Secret scan

# Scans the commits a pull request or a push to main introduces for committed
# secrets, using the gitleaks CLI and the repo's .gitleaks.toml — the same engine
# and config the .husky/pre-commit hook uses, so local and CI verdicts agree.
# The hook only fires where gitleaks is installed; this is the backstop that
# always runs (ops#32).
#
# Why the CLI binary, not gitleaks/gitleaks-action@v2: the action demands a paid
# GITLEAKS_LICENSE for repositories owned by an organization, and hirobius is an
# org. The CLI is MIT-licensed. It is pinned by version AND SHA-256, so a swapped
# release asset fails the install instead of running.
#
# Why only the change range: a full-history scan on every PR would turn one
# historic finding into a permanently red check nobody can fix in their PR.
# scripts/secret-scan-range.mjs picks base..head for a PR, before..after for a
# push. A manual run (workflow_dispatch) scans the full history of the chosen
# ref — the quarterly full scan docs/security/audit-log.md calls for.
#
# Why --redact: hirobius/ops is public, so Actions logs are public. Findings are
# reported by rule, file, line, and commit, never by value.

on:
  # Every PR, whatever its base — a pushed PR commit is already public.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deliberately no `concurrency:` block. Each run scans only its own range, so
# every run must finish, and the job takes seconds. A concurrency group cancels
# a *pending* run whenever a newer run queues in the same group, even with
# cancel-in-progress: false. On main that silently skips a push's
# before..after or a queued full-history dispatch. On a PR, cancelling lets a
# commit force-pushed away mid-scan go unscanned, though it stays public by SHA.
# Without cancellation that run completes and fails in the Actions tab, which
# notifies the pusher to rotate the value.

env:
  GITLEAKS_VERSION: '8.30.1'
  # gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt.
  # Bump both together.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Gitleaks (changed commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Both ends of the range must exist locally. gitleaks passes a bad
          # revision straight to git log and reports "0 commits scanned" as a
          # clean pass, so the range step below verifies the commits first.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve commit range
        id: range
        run: node scripts/secret-scan-range.mjs

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan changed commits
        id: scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          gitleaks version
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --exit-code 1 --log-opts="$LOG_OPTS" .

      - name: Explain how to resolve a failed scan
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Secret scan failed

          Check the **Scan changed commits** log. It either lists redacted findings
          (RuleID, File, Line, Commit) or shows an error that stopped gitleaks.

          **A real credential was committed.** This repo is public, so the value
          leaked when it was pushed. Deleting it from git does not undo that.
          1. **Rotate or revoke it at the provider first.** Paste-ready deep links
             for this account are in `CLAUDE.md`.
          2. Rewrite this branch so the value is gone from every commit, then push
             the branch again (never rewrite `main`).
          3. Load the new value from Vercel env vars or GitHub Actions secrets,
             never from a literal in the code.

          **It is a verified false positive** (a placeholder or test fixture). Add
          the narrowest possible `[[rules.allowlists]]` entry to `.gitleaks.toml`,
          scoped by path AND a regex for the placeholder, and write down why.

          Reproduce locally with gitleaks 8.30.1:
          `gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="origin/main..HEAD" .`
          EOF
